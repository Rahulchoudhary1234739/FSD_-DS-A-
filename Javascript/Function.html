<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <script>
        function abes(a,b){
            let sum = a + b;
            return sum;
        }
        document.write(abes(5,10) + "<br>");
        document.write(abes(15,20) + "<br>");
        document.write(abes(25,30) + "<br>");
    </script>
    
</body>
</html>
