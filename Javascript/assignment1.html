<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>

<body>


    <h1 style="text-align: center;">Shopping Cart</h1>

    <script style="text-align:center">


     
        let products = {
            Tea: 450,
            Coffee: 600,
            Sugar: 700,
            Pulses: 100,
            Rice: 200
        };
        

        
        let cart = {};

       
        document.write("<h2>Available Products</h2>");

        for (let item in products) {
            document.write(
                item + " : ₹" + products[item] + "<br>"
            );
        }

       
        let itemName = prompt("Enter the item you want to add:");

        if (itemName in products) {

            let quantity = Number(
                prompt("Enter quantity:")
            );

            cart[itemName] = quantity;

            document.write("<h2>Shopping Cart</h2>");

            let total = 0;

            for (let item in cart) {

                let price = products[item];
                let quantity = cart[item];

                let cost = price * quantity;

                total += cost;

                document.write(
                    item + 
                    " | Price: ₹" + price +
                    " | Quantity: " + quantity +
                    " | Cost: ₹" + cost +
                    "<br>"
                );
            }

            document.write("<h3>Total: ₹" + total + "</h3>");

        } else {

            document.write("<h3>Item not found!</h3>");
        }

    </script>

</body>
</html>
