<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        img {
            width : 80px;
            height : 100px;
        }
        table{
            width: 80%;
            margin: auto;
            padding: 10px;
            font-size: 25px;
            color: red;
            border: 2px solid black;

        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Tittle</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data" >

        </tbody>
    </table>
    <script>
       const ele = document.getElementById("data");
       const url = "https://dummyjson.com/products";
       async function loadData(){
           try{
            const response= await fetch(url);
            const data = await response.json();
            console.log(data.products);
            let rows = "";
            data.products.map((i,index)=>{
                rows += `<tr>
                <td>${index+1}</td>
                <td>${i.title}</td>
                <td><img src="${i.images[0]}"/></td>
                <td>${i.category}</td>
                <td>${i.price}</td>
</tr>`;
 ele.innerHTML = rows;
            })
           
            
            

           }
           catch(error){
               console.log(error);
           }
       }
       loadData();
    </script>
</body>
</html>
