<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    //code for (For loop)
    <p id="demo"></p>//it is called as it is inside body and not inside script tag
    <script>
        for (let i = 1; i <= 10; i++) {
            document.write("<br> abes college");
        }
        const Car = ["BMW", "Volvo", "mercedes", "Ford"];
        let text = "";
        for (let i = 0; i < Car.length; i++) {
            if (i == 1) {
                continue;
            }
            text += Car[i] + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
        console.log(typeof Car);
    </script>

</body>
</html>
